<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DocuAmiga — Law Firm Partnership</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;0,900;1,700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--dark:#1a1024;--pink:#e0197d;--orange:#f5a023;--purple:#7c3aed;--blue:#4169e1;--light:#fdf4f8;--gray:#6b7280;--border:#e5e7eb}
html{scroll-behavior:smooth}
body{font-family:'Inter',sans-serif;background:var(--dark);color:#fff;overflow-x:hidden;-webkit-font-smoothing:antialiased}

/* ── TOP NAV ── */
.topnav{position:fixed;top:0;left:0;right:0;z-index:9999;display:flex;align-items:center;justify-content:space-between;padding:14px 48px;background:rgba(26,16,36,.72);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,.07)}
.nav-logo{height:30px;width:auto;object-fit:contain}
.nav-brand{font-family:'Playfair Display',serif;font-size:22px;font-weight:700;color:#fff;text-decoration:none;letter-spacing:-.01em;line-height:1}
.nav-brand .na{background:linear-gradient(90deg,#e8a45a 0%,#e0197d 50%,#7c3aed 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.lang-toggle{display:flex;gap:2px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);border-radius:100px;padding:3px}
.lang-btn{font-size:12px;font-weight:700;letter-spacing:.06em;padding:6px 16px;border-radius:100px;border:none;cursor:pointer;transition:all .2s ease;background:transparent;color:rgba(255,255,255,.4);font-family:'Inter',sans-serif}
.lang-btn.active{background:rgba(255,255,255,.16);color:#fff}

/* ── HERO ── */
.hero{position:relative;height:100vh;min-height:680px;overflow:hidden;display:flex;align-items:center;padding-top:60px}
.hero-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 30%;transform:scale(1.06)}
.hero-grad{position:absolute;inset:0;z-index:1;background:linear-gradient(115deg,rgba(26,16,36,.95) 0%,rgba(26,16,36,.6) 55%,rgba(26,16,36,.15) 100%),linear-gradient(0deg,rgba(26,16,36,.85) 0%,transparent 45%)}
.hero-color{position:absolute;inset:0;z-index:2;background:linear-gradient(135deg,rgba(224,25,125,.18) 0%,rgba(124,58,237,.12) 50%,rgba(65,105,225,.1) 100%);mix-blend-mode:screen}
.hero-content{position:relative;z-index:10;max-width:1200px;margin:0 auto;padding:0 64px;width:100%}
.hero-badge{display:inline-flex;align-items:center;gap:10px;background:rgba(255,255,255,.1);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.2);border-radius:100px;padding:9px 20px;font-size:13px;font-weight:500;color:rgba(255,255,255,.85);margin-bottom:32px;opacity:0;animation:fadeUp .8s ease .3s forwards}
.pulse-dot{width:8px;height:8px;border-radius:50%;background:var(--pink);animation:pulse 2s ease infinite;flex-shrink:0}
.hero-title{font-family:'Playfair Display',serif;font-size:clamp(52px,7vw,96px);font-weight:900;line-height:1.02;margin-bottom:24px;opacity:0;animation:fadeUp .9s ease .5s forwards}
.hero-title .grad{background:linear-gradient(90deg,var(--pink) 0%,var(--orange) 50%,var(--purple) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero-sub{font-size:clamp(16px,1.8vw,21px);color:rgba(255,255,255,.72);font-weight:300;line-height:1.65;max-width:540px;margin-bottom:48px;opacity:0;animation:fadeUp .9s ease .7s forwards}
.hero-btns{display:flex;gap:16px;flex-wrap:wrap;opacity:0;animation:fadeUp .9s ease .9s forwards}
.btn-fill{background:var(--pink);color:#fff;font-weight:700;font-size:15px;padding:17px 38px;border-radius:100px;border:none;cursor:pointer;text-decoration:none;display:inline-block;transition:all .3s ease}
.btn-fill:hover{background:#c4166c;transform:scale(1.04);box-shadow:0 12px 32px rgba(224,25,125,.35)}
.btn-ghost{border:2px solid rgba(255,255,255,.35);color:#fff;font-weight:600;font-size:15px;padding:15px 36px;border-radius:100px;background:transparent;cursor:pointer;text-decoration:none;display:inline-block;transition:all .3s ease;backdrop-filter:blur(10px)}
.btn-ghost:hover{border-color:rgba(255,255,255,.75);background:rgba(255,255,255,.1)}
.scroll-ind{position:absolute;bottom:44px;left:50%;transform:translateX(-50%);z-index:10;display:flex;flex-direction:column;align-items:center;gap:10px;opacity:0;animation:fadeIn 1s ease 1.6s forwards}
.scroll-line{width:1px;height:52px;background:linear-gradient(to bottom,rgba(255,255,255,.6),transparent);animation:scrollBounce 2.2s ease infinite}
.scroll-txt{font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.35)}

/* ── INTRO ── */
.intro{background:#fff;padding:100px 64px}
.intro-inner{max-width:1200px;margin:0 auto}
.intro-top{display:grid;grid-template-columns:auto 1fr;gap:64px;align-items:center;padding-bottom:80px;border-bottom:1px solid var(--border)}
.intro-logo{height:40px;width:auto;filter:brightness(0)}
.intro-copy{font-size:20px;color:var(--gray);line-height:1.7;max-width:580px}
.intro-bottom{text-align:center;padding-top:80px;max-width:740px;margin:0 auto}

/* ── SHARED ── */
.label{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--pink);margin-bottom:14px}
.s-title{font-family:'Playfair Display',serif;font-size:clamp(34px,4.2vw,58px);font-weight:800;line-height:1.1;margin-bottom:20px}
.s-body{font-size:18px;line-height:1.7;color:var(--gray)}
.dark-label{color:var(--orange)}
.section-light{background:var(--light);padding:120px 64px}
.section-white{background:#fff;padding:120px 64px}
.inner{max-width:1200px;margin:0 auto}
.reveal{opacity:0;transform:translateY(32px);transition:opacity .7s ease,transform .7s ease}
.reveal.on{opacity:1;transform:translateY(0)}

/* ── SCRUB ── */
.scrub-wrap{height:280vh;position:relative;background:var(--dark)}
.scrub-sticky{position:sticky;top:0;height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:0 80px}
.scrub-bg{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,rgba(224,25,125,.1) 0%,transparent 70%)}
.scrub-text{font-family:'Playfair Display',serif;font-size:clamp(28px,3.8vw,60px);font-weight:800;line-height:1.5;text-align:center;max-width:860px;width:100%;position:relative;z-index:1;word-wrap:break-word;overflow-wrap:break-word}
.w{opacity:.12;filter:blur(4px);transition:opacity .5s ease,filter .5s ease}
.w.on{opacity:1;filter:blur(0)}
.w.pk{color:var(--pink)}
.w.gd{color:var(--orange)}

/* ── PROBLEM ── */
.cards-3{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;margin-top:64px}
.prob-card{background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 4px 20px rgba(26,16,36,.07);opacity:0;transform:translateY(36px);transition:opacity .6s ease,transform .6s ease,box-shadow .3s ease}
.prob-card.on{opacity:1;transform:translateY(0)}
.prob-card:hover{transform:translateY(-6px);box-shadow:0 20px 48px rgba(224,25,125,.12)}
.prob-card img{width:100%;height:210px;object-fit:cover;display:block}
.prob-body{padding:24px}
.prob-title{font-size:16px;font-weight:700;color:var(--dark);margin-bottom:8px}
.prob-desc{font-size:14px;color:var(--gray);line-height:1.65}

/* ── STRIP ── */
.strip{position:relative;height:58vh;overflow:hidden}
.strip img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.12);transform-origin:center;transition:transform .1s linear}
.strip-ov{position:absolute;inset:0;background:rgba(26,16,36,.7);display:flex;align-items:center;justify-content:center}
.strip-quote{font-family:'Playfair Display',serif;font-style:italic;font-size:clamp(20px,3.5vw,50px);font-weight:700;text-align:center;max-width:820px;padding:0 48px;line-height:1.35;color:#fff;opacity:0;transform:translateY(28px);transition:opacity .9s ease,transform .9s ease}
.strip-quote.on{opacity:1;transform:translateY(0)}

/* ── STICKY STEPS ── */
.steps-wrap{height:400vh;position:relative}
.steps-sticky{position:sticky;top:0;height:100vh;display:grid;grid-template-columns:1fr 1fr;overflow:hidden}
.steps-bar-track{position:absolute;top:0;left:0;right:0;height:3px;background:rgba(255,255,255,.1);z-index:20}
.steps-bar{height:100%;background:linear-gradient(90deg,#2563eb,var(--pink),var(--orange),var(--purple));width:0%;transition:width .08s linear}
.steps-left{background:var(--light);display:flex;flex-direction:column;justify-content:center;padding:64px 72px;overflow:hidden}
.step-label-top{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--pink);margin-bottom:24px}
.step-pills{display:flex;gap:8px;margin-bottom:44px}
.sp{height:6px;border-radius:3px;background:#d1d5db;transition:width .45s ease,background .45s ease;width:6px}
.sp.a{width:32px;background:var(--pink)}
.step-panel{display:none;flex-direction:column;gap:20px}
.step-panel.a{display:flex;animation:panelIn .4s ease forwards}
@keyframes panelIn{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
.step-num-row{display:flex;align-items:center;gap:14px}
.step-num{width:56px;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900;color:#fff;flex-shrink:0;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.step-chip{font-size:11px;font-weight:700;padding:6px 14px;border-radius:100px;color:#fff;letter-spacing:.06em;text-transform:uppercase}
.step-title{font-family:'Playfair Display',serif;font-size:clamp(26px,2.8vw,42px);font-weight:800;color:var(--dark);line-height:1.12}
.step-desc{font-size:15px;line-height:1.8;color:var(--gray);white-space:pre-line}
.steps-right{position:relative;overflow:hidden}
.step-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transform:scale(1.09);transition:opacity .55s ease,transform .55s ease}
.step-img.a{opacity:1;transform:scale(1)}
.img-grad{position:absolute;inset:0;background:linear-gradient(to top,rgba(26,16,36,.65),transparent 50%);z-index:2}
.float-card{position:absolute;bottom:32px;left:32px;right:32px;z-index:10;background:rgba(255,255,255,.14);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.22);border-radius:18px;padding:18px 22px;display:flex;align-items:center;gap:14px;opacity:0;transform:translateY(14px);transition:opacity .35s ease,transform .35s ease}
.float-card.a{opacity:1;transform:translateY(0)}
.fi{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.fi svg{width:20px;height:20px}
.ft{color:#fff;font-weight:600;font-size:14px}
.fs{color:rgba(255,255,255,.5);font-size:12px;margin-top:2px}

/* ── SERVICES ── */
.line-heading{margin:56px 0 28px;padding-left:20px;border-left:4px solid var(--pink)}
.line-heading h3{font-family:'Playfair Display',serif;font-size:clamp(18px,2.2vw,26px);font-weight:800;color:var(--dark);margin-bottom:6px}
.line-heading p{font-size:13px;color:var(--gray);line-height:1.5}
.line-heading.ess-head{border-left-color:var(--blue);margin-top:80px}
.svcs-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;align-items:start}
.svc-card{border:2px solid var(--border);border-radius:24px;padding:36px;background:#fff;opacity:0;transform:translateY(28px);transition:all .55s ease}
.svc-card.on{opacity:1;transform:translateY(0)}
.svc-card:hover{transform:translateY(-6px);box-shadow:0 20px 44px rgba(26,16,36,.1)}
.svc-card.feat{border-color:var(--orange);box-shadow:0 24px 60px rgba(245,160,35,.14);transform:translateY(28px) scale(1.02)}
.svc-card.feat.on{transform:translateY(0) scale(1.02)}
.svc-card.feat:hover{transform:translateY(-6px) scale(1.02)}
.rec-badge{display:inline-block;font-size:11px;font-weight:700;padding:5px 14px;border-radius:100px;background:var(--orange);color:#fff;margin-bottom:20px;text-transform:uppercase;letter-spacing:.06em}
.svc-name{font-family:'Playfair Display',serif;font-size:22px;font-weight:800;color:var(--dark);margin-bottom:8px}
.svc-price{font-size:48px;font-weight:900;color:var(--blue);line-height:1;margin-bottom:8px}
.svc-window{font-size:13px;color:#9ca3af;margin-bottom:16px}
.svc-meta{display:flex;flex-direction:column;gap:5px;font-size:13px;color:#9ca3af;border-bottom:1px solid #f3f4f6;padding-bottom:18px;margin-bottom:18px}
.svc-features{list-style:none;display:flex;flex-direction:column;gap:11px}
.svc-feat{display:flex;align-items:flex-start;gap:10px;font-size:14px;color:#374151;line-height:1.4}
.chk{width:18px;height:18px;border-radius:50%;background:var(--pink);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.chk svg{width:10px;height:10px}
.svc-btn{width:100%;margin-top:24px;padding:14px;border-radius:14px;font-size:14px;font-weight:700;cursor:pointer;border:none;transition:all .3s ease;font-family:'Inter',sans-serif}
.svc-btn-fill{background:var(--pink);color:#fff}
.svc-btn-fill:hover{background:#c4166c}
.svc-btn-out{background:transparent;border:2px solid var(--pink);color:var(--pink)}
.svc-btn-out:hover{background:#fdf4f8}
.earn-line{text-align:center;margin-top:12px;font-size:13px;color:var(--pink);font-weight:600}
/* Essential card */
.ess-card{border:2px solid var(--blue);border-radius:24px;padding:40px 44px;background:#fff;display:grid;grid-template-columns:200px 1fr 200px;gap:40px;align-items:center;opacity:0;transform:translateY(28px);transition:all .55s ease}
.ess-card.on{opacity:1;transform:translateY(0)}
.ess-card:hover{transform:translateY(-4px);box-shadow:0 20px 44px rgba(65,105,225,.11)}
.ess-price-block{text-align:center;padding-right:40px;border-right:1px solid #f3f4f6}
.ess-price{font-size:clamp(42px,4.5vw,60px);font-weight:900;color:var(--blue);line-height:1;margin-bottom:10px}
.ess-meta-item{font-size:13px;color:#9ca3af;margin-top:4px}
.ess-feats{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:9px}
.ess-actions{text-align:center;padding-left:40px;border-left:1px solid #f3f4f6}

/* ── COMMISSION ── */
.commission{background:var(--dark);padding:140px 64px;position:relative;overflow:hidden}
.comm-bg{position:absolute;inset:0;background:radial-gradient(ellipse at 20% 50%,rgba(224,25,125,.22) 0%,transparent 60%),radial-gradient(ellipse at 80% 50%,rgba(124,58,237,.22) 0%,transparent 60%)}
.comm-inner{position:relative;z-index:1;max-width:1100px;margin:0 auto}
.comm-head{text-align:center;margin-bottom:80px}
.comm-tiers{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:56px}
.tier{border:1px solid rgba(255,255,255,.12);border-radius:24px;padding:52px 40px;background:rgba(255,255,255,.05);backdrop-filter:blur(10px);text-align:center;opacity:0;transform:translateY(28px);transition:all .6s ease}
.tier.on{opacity:1;transform:translateY(0)}
.tier.gold{border-color:var(--orange);background:rgba(245,160,35,.07)}
.tier-range{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.45);margin-bottom:10px}
.tier-pct{font-family:'Playfair Display',serif;font-size:88px;font-weight:900;line-height:1;margin-bottom:8px}
.tier:first-child .tier-pct{color:var(--pink)}
.tier.gold .tier-pct{color:var(--orange)}
.tier-lbl{font-size:15px;color:rgba(255,255,255,.65);font-weight:500}
.comm-details{display:grid;grid-template-columns:repeat(3,1fr);gap:32px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:40px 48px;text-align:center;opacity:0;transform:translateY(24px);transition:all .6s ease .2s}
.comm-details.on{opacity:1;transform:translateY(0)}
.comm-d-icon{width:52px;height:52px;border-radius:16px;margin:0 auto 14px;display:flex;align-items:center;justify-content:center}
.comm-d-icon svg{width:26px;height:26px}
.comm-d h4{font-size:17px;font-weight:700;color:#fff;margin-bottom:8px}
.comm-d p{font-size:14px;color:rgba(255,255,255,.45);line-height:1.55}

/* ── PARTNER BENEFITS ── */
.partner-grid{display:grid;grid-template-columns:1fr 1fr;gap:64px;align-items:center;margin-top:64px}
.partner-img-wrap{border-radius:24px;overflow:hidden;aspect-ratio:4/3;opacity:0;transform:translateX(-30px);transition:all .7s ease}
.partner-img-wrap.on{opacity:1;transform:translateX(0)}
.partner-img-wrap img{width:100%;height:100%;object-fit:cover}
.benefits{display:flex;flex-direction:column;gap:26px}
.ben{display:flex;gap:18px;align-items:flex-start;opacity:0;transform:translateX(28px);transition:opacity .6s ease,transform .6s ease}
.ben.on{opacity:1;transform:translateX(0)}
.ben-ico{width:48px;height:48px;border-radius:14px;background:rgba(224,25,125,.1);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--pink)}
.ben-ico svg{width:22px;height:22px}
.ben-title{font-size:16px;font-weight:700;color:var(--dark);margin-bottom:4px}
.ben-desc{font-size:14px;color:var(--gray);line-height:1.55}

/* ── FAQ ── */
.faq-list{max-width:780px;margin:64px auto 0}
.faq-item{border:1px solid var(--border);border-radius:16px;margin-bottom:12px;overflow:hidden}
.faq-btn{width:100%;display:flex;align-items:center;justify-content:space-between;padding:22px 26px;background:none;border:none;text-align:left;cursor:pointer;font-size:16px;font-weight:600;color:var(--dark);font-family:'Inter',sans-serif;transition:background .2s;gap:16px}
.faq-btn:hover{background:#f9fafb}
.faq-ico{width:22px;height:22px;color:#9ca3af;flex-shrink:0;transition:transform .25s ease}
.faq-item.open .faq-ico{transform:rotate(180deg)}
.faq-body{max-height:0;overflow:hidden;transition:max-height .35s ease}
.faq-item.open .faq-body{max-height:400px}
.faq-text{padding:0 26px 22px;font-size:15px;color:var(--gray);line-height:1.7}

/* ── CTA ── */
.cta{background:var(--dark);padding:140px 64px;text-align:center;position:relative;overflow:hidden}
.cta-bg{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,rgba(224,25,125,.28) 0%,transparent 65%)}
.cta-inner{position:relative;z-index:1}
.cta-title{font-family:'Playfair Display',serif;font-size:clamp(42px,6vw,80px);font-weight:900;line-height:1.04;margin-bottom:24px}
.cta-sub{font-size:20px;color:rgba(255,255,255,.6);max-width:520px;margin:0 auto 48px;line-height:1.55}
.cta-row{display:flex;justify-content:center;gap:16px;flex-wrap:wrap}
.contact-strip{display:flex;justify-content:center;gap:56px;flex-wrap:wrap;margin-top:64px;padding-top:64px;border-top:1px solid rgba(255,255,255,.1)}
.contact-item{display:flex;flex-direction:column;gap:5px}
.contact-lbl{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.3)}
.contact-val{font-size:16px;font-weight:600;color:rgba(255,255,255,.82)}

/* ── FOOTER ── */
footer{background:var(--dark);border-top:1px solid rgba(255,255,255,.08);padding:28px 48px;display:flex;align-items:center;justify-content:space-between}
.footer-logo{height:26px;width:auto}
.footer-copy{font-size:13px;color:rgba(255,255,255,.28)}

/* ── ANIMATIONS ── */
@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.75)}}
@keyframes scrollBounce{0%,100%{opacity:1;transform:scaleY(1);transform-origin:top}50%{opacity:.4;transform:scaleY(.55);transform-origin:top}}

/* ── RESPONSIVE ── */
@media(max-width:900px){
  .topnav{padding-left:20px;padding-right:20px}
  .hero-content,.intro,.comm-inner{padding-left:28px;padding-right:28px}
  .section-light,.section-white,.commission,.cta{padding-left:28px;padding-right:28px}
  .intro-top{grid-template-columns:1fr;gap:28px}
  .cards-3,.svcs-grid,.comm-tiers,.comm-details,.partner-grid{grid-template-columns:1fr}
  .ess-card{grid-template-columns:1fr}
  .ess-price-block{padding-right:0;border-right:none;border-bottom:1px solid #f3f4f6;padding-bottom:20px}
  .ess-feats{grid-template-columns:1fr}
  .ess-actions{padding-left:0;border-left:none;padding-top:20px;border-top:1px solid #f3f4f6}
  .steps-sticky{grid-template-columns:1fr}
  .steps-right{display:none}
  .contact-strip{gap:28px}
  footer{padding-left:28px;padding-right:28px;flex-direction:column;gap:12px;text-align:center}

/* ── HELPERS ── */
function chkIco(){return`<span class="chk"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>`}

/* ── RENDER ── */
let curLang='en';

function setLang(l){
  curLang=l;
  document.getElementById('btnEN').classList.toggle('active',l==='en');
  document.getElementById('btnES').classList.toggle('active',l==='es');
  render(l);
}

function render(l){
  const t=T[l];
  const txt={heroBadge:t.badge,heroSub:t.heroSub,scrollTxt:t.scrollLbl,introCopy:t.introCopy,introOppLabel:t.introOppLabel,introBody:t.introBody,probLabel:t.probLabel,probTitle:t.probTitle,probSub:t.probSub,howLabel:t.howLabel,svcsLabel:t.svcsLabel,svcsTitle:t.svcsTitle,svcsSub:t.svcsSub,premiumTitle:t.premiumTitle,premiumSub:t.premiumSub,essentialTitle:t.essentialTitle,essentialSub:t.essentialSub,commLabel:t.commLabel,commSub:t.commSub,tier1range:t.tier1range,tier1lbl:t.tier1lbl,tier2range:t.tier2range,tier2lbl:t.tier2lbl,benLabel:t.benLabel,benTitle:t.benTitle,faqLabel:t.faqLabel,faqTitle:t.faqTitle,ctaLabel:t.ctaLabel,ctaSub:t.ctaSub,ctaCommLbl:t.ctaCommLbl,ctaVisaLbl:t.ctaVisaLbl,ctaAgreLbl:t.ctaAgreLbl,ctaAgreVal:t.ctaAgreVal,footerCopy:t.footerCopy};
  Object.entries(txt).forEach(([id,v])=>{const el=document.getElementById(id);if(el)el.textContent=v});
  const html={heroTitle:t.heroTitle,introTitle:t.introTitle,stripQuote:t.stripQuote,commTitle:t.commTitle,ctaTitle:t.ctaTitle};
  Object.entries(html).forEach(([id,v])=>{const el=document.getElementById(id);if(el)el.innerHTML=v});
  document.getElementById('cta1').textContent=t.cta1;
  document.getElementById('cta2').textContent=t.cta2;
  document.getElementById('ctaBtn1').textContent=t.ctaBtn1;
  document.getElementById('ctaBtn2').textContent=t.ctaBtn2;
  rebuildScrub(l);rebuildProblems(l);rebuildSteps(l);
  rebuildServices(l);rebuildCommDetails(l);rebuildBenefits(l);rebuildFaq(l);
  setTimeout(onScroll,60);
}

function rebuildScrub(l){
  const words=T[l].scrubWords;
  document.getElementById('scrubText').innerHTML=words.map(w=>`<span class="${w.c}">${w.t}</span> `).join('');
}

function rebuildProblems(l){
  const imgs=['https://images.unsplash.com/photo-1568667256549-094345857637?w=700&q=85','https://images.unsplash.com/photo-1554224155-6726b3ff858f?w=700&q=85','https://images.unsplash.com/photo-1588872657578-7efd1f1555ed?w=700&q=85'];
  document.getElementById('probCards').innerHTML=T[l].prob.map((p,i)=>`<div class="prob-card" style="transition-delay:${i*.12}s"><img src="${imgs[i]}" alt=""><div class="prob-body"><h3 class="prob-title">${p.title}</h3><p class="prob-desc">${p.desc}</p></div></div>`).join('');
}

function rebuildSteps(l){
  const steps=T[l].steps;
  steps.forEach((s,i)=>{
    document.getElementById(`sc${i}`).textContent=s.badge;
    document.getElementById(`st${i}`).textContent=s.title;
    document.getElementById(`sd${i}`).textContent=s.desc;
    document.getElementById(`ff${i}`).textContent=s.fc;
    document.getElementById(`fs${i}`).textContent=s.fcs;
  });
}

function rebuildServices(l){
  const t=T[l];
  document.getElementById('premiumCards').innerHTML=t.plans.map((p,i)=>`
    <div class="svc-card${p.feat?' feat':''}" style="transition-delay:${[0,.14,.28][i]}s">
      ${p.feat?`<div class="rec-badge">${t.recommended}</div>`:''}
      <h3 class="svc-name">${p.name}</h3>
      <div class="svc-price">${p.price}</div>
      <div class="svc-meta"><span>⏱ ${p.days}</span><span>📋 ${p.sessions}</span><span style="font-size:12px;color:#d1d5db">${p.note}</span></div>
      <ul class="svc-features">${p.feats.map(f=>`<li class="svc-feat">${chkIco()}${f}</li>`).join('')}</ul>
      <button class="svc-btn ${p.feat?'svc-btn-fill':'svc-btn-out'}">${t.referBtn}</button>
      <p class="earn-line">${t.firmEarns} <strong>${p.earn}</strong></p>
    </div>`).join('');
  const ep=t.essentialPlan;
  document.getElementById('essentialCardWrap').innerHTML=`
    <div class="ess-card">
      <div class="ess-price-block">
        <div class="ess-price">${ep.price}</div>
        <div class="ess-meta-item">⏱ ${ep.days}</div>
        <div class="ess-meta-item">📋 ${ep.sessions}</div>
      </div>
      <div>
        <h3 class="svc-name" style="margin-bottom:6px">${ep.name}</h3>
        <p style="font-size:13px;color:#9ca3af;margin-bottom:18px">${ep.note}</p>
        <ul class="ess-feats">${ep.feats.map(f=>`<li class="svc-feat">${chkIco()}${f}</li>`).join('')}</ul>
      </div>
      <div class="ess-actions">
        <button class="svc-btn svc-btn-out" style="margin-top:0">${t.referBtn}</button>
        <p class="earn-line" style="margin-top:14px">${t.firmEarns}<br><strong>${ep.earn}</strong></p>
      </div>
    </div>`;
}

function rebuildCommDetails(l){
  T[l].commDetails.forEach((d,i)=>{
    const el=document.getElementById(`cd${i}`);if(!el)return;
    el.querySelector('.comm-d-icon').style.background=d.bg;
    el.querySelector('.comm-d-icon').style.color=d.color;
    el.querySelector('.comm-d-icon').innerHTML=ICO[d.icon];
    el.querySelector('h4').textContent=d.title;
    el.querySelector('p').textContent=d.text;
  });
}

function rebuildBenefits(l){
  document.getElementById('benefitsList').innerHTML=T[l].benefits.map((b,i)=>`
    <div class="ben" style="transition-delay:${i*.1}s">
      <div class="ben-ico" style="background:${b.col};color:${b.icol}">${ICO[b.icon]}</div>
      <div><div class="ben-title">${b.title}</div><div class="ben-desc">${b.desc}</div></div>
    </div>`).join('');
}

function rebuildFaq(l){
  document.getElementById('faqList').innerHTML=T[l].faqs.map(f=>`
    <div class="faq-item">
      <button class="faq-btn" onclick="toggleFaq(this)">${f.q}
        <svg class="faq-ico" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M19 9l-7 7-7-7"/></svg>
      </button>
      <div class="faq-body"><p class="faq-text">${f.a}</p></div>
    </div>`).join('');
}

/* ── SCROLL ── */
const stepsWrap=document.getElementById('how');
const sBar=document.getElementById('sBar');
const pills=document.querySelectorAll('.sp');
const panels=[0,1,2,3].map(i=>document.getElementById(`sp${i}`));
const imgs=[0,1,2,3].map(i=>document.getElementById(`si${i}`));
const fcs=[0,1,2,3].map(i=>document.getElementById(`fc${i}`));
let curStep=-1;

function setStep(s){
  if(s===curStep)return;curStep=s;
  pills.forEach((p,i)=>p.classList.toggle('a',i===s));
  panels.forEach((p,i)=>p.classList.toggle('a',i===s));
  imgs.forEach((g,i)=>g.classList.toggle('a',i===s));
  fcs.forEach((f,i)=>f.classList.toggle('a',i===s));
}

const scrubWrap=document.getElementById('scrub');
const stripEl=document.getElementById('strip');
const stripImg=document.getElementById('stripImg');
const stripQuoteEl=document.getElementById('stripQuote');

function onScroll(){
  const wh=window.innerHeight;
  if(stepsWrap){
    const r=stepsWrap.getBoundingClientRect();
    const prog=Math.max(0,Math.min(1,-r.top/(stepsWrap.offsetHeight-wh)));
    sBar.style.width=(prog*100)+'%';
    setStep(Math.min(3,Math.floor(prog*4)));
  }
  const scrubWords=document.querySelectorAll('#scrubText .w');
  if(scrubWrap&&scrubWords.length){
    const r=scrubWrap.getBoundingClientRect();
    const prog=Math.max(0,Math.min(1,-r.top/(scrubWrap.offsetHeight-wh)));
    const lit=Math.floor(prog*(scrubWords.length+4));
    scrubWords.forEach((w,i)=>w.classList.toggle('on',i<lit));
  }
  if(stripEl){
    const r=stripEl.getBoundingClientRect();
    const prog=1-(r.top+r.height)/(wh+r.height);
    stripImg.style.transform=`scale(1.12) translateY(${prog*-45}px)`;
    if(r.top<wh*.78)stripQuoteEl.classList.add('on');
  }
  document.querySelectorAll('.reveal,.prob-card,.svc-card,.ess-card,.tier,.partner-img-wrap,.ben').forEach(el=>{
    if(el.getBoundingClientRect().top<wh*.9)el.classList.add('on');
  });
  const cd=document.getElementById('commDetails');
  if(cd&&cd.getBoundingClientRect().top<wh*.9)cd.classList.add('on');
}

window.addEventListener('scroll',onScroll,{passive:true});
function toggleFaq(btn){const item=btn.parentElement;const was=item.classList.contains('open');document.querySelectorAll('.faq-item').forEach(i=>i.classList.remove('open'));if(!was)item.classList.add('open')}

/* ── INIT ── */
render('en');
</script>
